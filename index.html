<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصح | حاسبة السعرات</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f7f4;
      color: #1d2922;
      font-family: Arial, Tahoma, sans-serif;
    }

    .card {
      max-width: 520px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #19332112;
    }

    h1 {
      margin: 0 0 8px;
      color: #167344;
    }

    .intro {
      margin: 0 0 22px;
      color: #59645d;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd6ce;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: 2px solid #7ac49a;
      border-color: #167344;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #167344;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #105b34;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #edf8f0;
      border-radius: 12px;
      line-height: 1.9;
    }

    .notice {
      margin-top: 18px;
      color: #68736b;
      font-size: 13px;
      line-height: 1.7;
    }

    .number {
      color: #12663b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>الصح</h1>
    <p class="intro">احسب احتياجك اليومي التقريبي من السعرات الحرارية.</p>

    <form id="calorieForm">
      <label for="sex">المعادلة المستخدمة</label>
      <select id="sex" required>
        <option value="male">رجل</option>
        <option value="female">امرأة</option>
      </select>

      <label for="age">العمر (سنة)</label>
      <input id="age" type="number" min="18" max="100" placeholder="مثال: 28" required />

      <label for="weight">الوزن (كجم)</label>
      <input id="weight" type="number" min="30" max="300" step="0.1" placeholder="مثال: 75" required />

      <label for="height">الطول (سم)</label>
      <input id="height" type="number" min="120" max="230" placeholder="مثال: 175" required />

      <label for="activity">مستوى النشاط اليومي</label>
      <select id="activity" required>
        <option value="1.2">قليل الحركة — تمرين نادر أو بدون تمرين</option>
        <option value="1.375">نشاط خفيف — تمرين 1–3 أيام بالأسبوع</option>
        <option value="1.55">نشاط متوسط — تمرين 3–5 أيام بالأسبوع</option>
        <option value="1.725">نشاط عالٍ — تمرين قوي 6–7 أيام بالأسبوع</option>
        <option value="1.9">نشاط عالٍ جدًا — تمرين شاق مع عمل بدني</option>
      </select>

      <label for="goal">الهدف</label>
      <select id="goal">
        <option value="maintain">المحافظة على الوزن</option>
        <option value="lose">نزول وزن تدريجي</option>
        <option value="gain">زيادة وزن تدريجية</option>
      </select>

      <button type="submit">احسب احتياجي</button>
    </form>

    <section id="result" aria-live="polite"></section>

    <p class="notice">
      النتيجة تقديرية وقد تختلف عن احتياج جسمك الفعلي. هذه الحاسبة للبالغين
      فقط، وليست مناسبة لمن هم دون 18 سنة أو للحمل والرضاعة أو للحالات
      الصحية التي تحتاج متابعة مختص.
    </p>
  </main>

  <script>
    const form = document.getElementById("calorieForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const sex = document.getElementById("sex").value;
      const age = Number(document.getElementById("age").value);
      const weight = Number(document.getElementById("weight").value);
      const height = Number(document.getElementById("height").value);
      const activity = Number(document.getElementById("activity").value);
      const goal = document.getElementById("goal").value;

      if (!age || !weight || !height || age < 18) {
        result.style.display = "block";
        result.textContent = "من فضلك أدخل بيانات صحيحة. الحاسبة مخصصة للبالغين.";
        return;
      }

      // معادلة Mifflin–St Jeor لتقدير معدل الحرق أثناء الراحة
      const bmr = (10 * weight) + (6.25 * height) - (5 * age)
        + (sex === "male" ? 5 : -161);

      // تقدير إجمالي الاحتياج اليومي بحسب مستوى النشاط
      const maintenance = bmr * activity;

      let target = maintenance;
      let goalText = "للمحافظة على الوزن";

      if (goal === "lose") {
        target = maintenance * 0.90;
        goalText = "لنزول تدريجي في الوزن";
      } else if (goal === "gain") {
        target = maintenance * 1.10;
        goalText = "لزيادة تدريجية في الوزن";
      }

      result.style.display = "block";
      result.innerHTML = `
        <div>معدل الحرق الأساسي التقريبي: <span class="number">${Math.round(bmr)}</span> سعرة/يوم</div>
        <div>احتياج المحافظة على الوزن: <span class="number">${Math.round(maintenance)}</span> سعرة/يوم</div>
        <div>${goalText}: <span class="number">${Math.round(target)}</span> سعرة/يوم</div>
        <small>راقب تغيّر الوزن والطاقة مع الوقت؛ الرقم نقطة بداية تقديرية، وليس قياسًا دقيقًا.</small>
      `;
    });
  </script>
</body>
</html>
